jobs:
      folder('Github') {
        displayName('Github Projects')
        properties {
          folderLibraries {
            libraries {
              libraryConfiguration {
                name("jenkins-library")
                defaultVersion("master")
                implicit(true)
                retriever {
                  modernSCM {
                    scm {
                      github {
                        repositoryUrl('https://github.com/Yogeshwaran-Palanisamy/jenkins-library.git')
                        credentialsId("continuous-integration-check")
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
      multibranchPipelineJob('Github/Jenkins') {
        branchSources {
          github {
            id = 'configuration-as-code'
            repoOwner('Yogeshwaran-Palanisamy')
            configuredByUrl(false)
            repository('jenkins')
            scanCredentialsId("continuous-integration-check")
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath("ci/jenkinsfile")
          }
          workflowBranchProjectFactory {
            scriptPath("ci/Jenkinsfile")
          }
          workflowBranchProjectFactory {
            scriptPath(".ci/Jenkinsfile")
          }
          workflowBranchProjectFactory {
            scriptPath(".ci/jenkinsfile")
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(5)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('5')
          }
        }
      }

